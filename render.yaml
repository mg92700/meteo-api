# Déploiement Render (offre gratuite) : New > Blueprint > ce dépôt
services:
  - type: web
    name: meteo-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # Base Supabase mutualisée (Connect > Session pooler), schéma platform
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: platform
      - key: METEO_SERVICE_EMAIL
        sync: false
      - key: METEO_SERVICE_PASSWORD_HASH
        sync: false
